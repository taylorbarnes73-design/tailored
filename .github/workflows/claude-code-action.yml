name: Claude Code Action Official

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  claude:
    name: Run Claude Code Action
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Claude Code Action Official
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
